events {
    worker_connections 1024;
}

http {
    # Use Docker's internal DNS so upstream IPs are re-resolved after container restarts.
    # Without this, nginx caches IPs at startup and gets 502s when containers restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=call_limit:10m rate=10r/m;

    # Redirect HTTP → HTTPS
    server {
        listen 80;
        server_name api.fixilya.pro;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name api.fixilya.pro;

        ssl_certificate     /etc/letsencrypt/live/api.fixilya.pro/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.fixilya.pro/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Health check
        location /health {
            return 200 '{"status":"healthy","gateway":"nginx"}';
            add_header Content-Type application/json;
        }

        # Auth Service
        location /api/auth {
            limit_req zone=api_limit burst=20 nodelay;
            set $upstream_auth http://auth-service:3001;
            proxy_pass $upstream_auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Agora Token (handled by auth-service)
        location /api/agora {
            limit_req zone=api_limit burst=30 nodelay;
            set $upstream_auth http://auth-service:3001;
            proxy_pass $upstream_auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Notification token (handled by auth-service)
        location /api/notifications {
            limit_req zone=api_limit burst=20 nodelay;
            set $upstream_notification http://notification-service:3005;
            proxy_pass $upstream_notification;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # User Service
        location /api/users {
            limit_req zone=api_limit burst=20 nodelay;
            set $upstream_user http://user-service:3002;
            proxy_pass $upstream_user;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/handymen {
            limit_req zone=api_limit burst=20 nodelay;
            set $upstream_user http://user-service:3002;
            proxy_pass $upstream_user;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Booking Service
        location /api/bookings {
            limit_req zone=api_limit burst=20 nodelay;
            set $upstream_booking http://booking-service:3003;
            proxy_pass $upstream_booking;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Payment Service
        location /api/payments {
            limit_req zone=api_limit burst=50 nodelay;
            set $upstream_payment http://payment-service:3004;
            proxy_pass $upstream_payment;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Media Service
        location /api/media {
            limit_req zone=api_limit burst=10 nodelay;
            client_max_body_size 10M;
            set $upstream_media http://media-service:3006;
            proxy_pass $upstream_media;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Call Service
        location /api/calls {
            limit_req zone=call_limit burst=5 nodelay;
            set $upstream_call http://call-service:3007;
            proxy_pass $upstream_call;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}

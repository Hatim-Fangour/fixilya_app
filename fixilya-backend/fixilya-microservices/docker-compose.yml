version: '3.8'

services:
  # Redis
  redis:
    image: redis:7-alpine
    container_name: fixilya-redis
    ports:
      - "6379:6379"
    networks:
      - fixilya-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Auth Service
  auth-service:
    build:
      context: ./services/auth-service
    container_name: auth-service
    environment:
      - PORT=3001
      - NODE_ENV=production
    env_file:
      - ./services/auth-service/.env
    ports:
      - "3001:3001"
    depends_on:
      - redis
    networks:
      - fixilya-network
    restart: unless-stopped

  # User Service
  user-service:
    build:
      context: ./services/user-service
    container_name: user-service
    environment:
      - PORT=3002
      - AUTH_SERVICE_URL=http://auth-service:3001
    env_file:
      - ./services/user-service/.env
    ports:
      - "3002:3002"
    depends_on:
      - auth-service
      - redis
    networks:
      - fixilya-network
    restart: unless-stopped

  # Booking Service
  booking-service:
    build:
      context: ./services/booking-service
    container_name: booking-service
    environment:
      - PORT=3003
      - AUTH_SERVICE_URL=http://auth-service:3001
      - NOTIFICATION_SERVICE_URL=http://notification-service:3005
    env_file:
      - ./services/booking-service/.env
    ports:
      - "3003:3003"
    depends_on:
      - auth-service
      - redis
    networks:
      - fixilya-network
    restart: unless-stopped

  # Payment Service
  payment-service:
    build:
      context: ./services/payment-service
    container_name: payment-service
    environment:
      - PORT=3004
      - AUTH_SERVICE_URL=http://auth-service:3001
    env_file:
      - ./services/payment-service/.env
    ports:
      - "3004:3004"
    depends_on:
      - auth-service
      - redis
    networks:
      - fixilya-network
    restart: unless-stopped

  # Notification Service
  notification-service:
    build:
      context: ./services/notification-service
    container_name: notification-service
    environment:
      - PORT=3005
    env_file:
      - ./services/notification-service/.env
    ports:
      - "3005:3005"
    depends_on:
      - redis
    networks:
      - fixilya-network
    restart: unless-stopped

  # Media Service
  media-service:
    build:
      context: ./services/media-service
    container_name: media-service
    environment:
      - PORT=3006
      - AUTH_SERVICE_URL=http://auth-service:3001
    env_file:
      - ./services/media-service/.env
    ports:
      - "3006:3006"
    depends_on:
      - auth-service
    networks:
      - fixilya-network
    restart: unless-stopped

  # Call Service
  call-service:
    build:
      context: ./services/call-service
    container_name: call-service
    environment:
      - PORT=3007
      - NODE_ENV=production
    env_file:
      - ./services/call-service/.env
    ports:
      - "3007:3007"
    depends_on:
      - redis
    networks:
      - fixilya-network
    restart: unless-stopped

  # Nginx API Gateway
  nginx:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - auth-service
      - user-service
      - booking-service
      - payment-service
      - notification-service
      - media-service
      - call-service
    networks:
      - fixilya-network
    restart: unless-stopped

networks:
  fixilya-network:
    driver: bridge
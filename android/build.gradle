buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath 'com.google.gms:google-services:4.4.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // Agora RTC Maven repository
        maven { url 'https://jitpack.io' }
        maven { url 'https://release-agora-io.oss-cn-hangzhou.aliyuncs.com' }
    }
}

// Redirect build outputs:
// - :app → {flutterProjectRoot}/build/app  (Flutter tool looks here for the APK)
// - all plugin libraries → C:/flutter_builds/  (outside OneDrive to avoid file-locking)
def pluginBuildRoot = 'C:/flutter_builds/fixilya_app'
subprojects {
    if (project.name == 'app') {
        // rootProject.projectDir is android/, so ../build/app resolves to
        // {flutterProjectRoot}/build/app — exactly where Flutter expects the APK.
        project.buildDir = "${rootProject.projectDir}/../build/app"
    } else {
        project.buildDir = "${pluginBuildRoot}/${project.name}"
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete "${rootProject.projectDir}/../build"
    delete pluginBuildRoot
}